name: Deploy Node.js project to Azure Function App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20.x"

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: dev
    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Check Azure Functions deployment configuration
        id: config
        shell: pwsh
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_FUNCTIONAPP_PACKAGE_PATH: ${{ vars.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          AZURE_FUNCTIONAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          $deployEnabled = $true
          $packagePath = $env:AZURE_FUNCTIONAPP_PACKAGE_PATH
          $packageManager = "npm"

          if ([string]::IsNullOrWhiteSpace($env:AZURE_FUNCTIONAPP_NAME)) {
            Write-Host "::notice::Skipping Azure Functions deployment because repository variable AZURE_FUNCTIONAPP_NAME is not set."
            $deployEnabled = $false
          }

          if ([string]::IsNullOrWhiteSpace($packagePath)) {
            Write-Host "::notice::Skipping Azure Functions deployment because repository variable AZURE_FUNCTIONAPP_PACKAGE_PATH is not set."
            $deployEnabled = $false
          }

          if ([string]::IsNullOrWhiteSpace($env:AZURE_FUNCTIONAPP_PUBLISH_PROFILE)) {
            Write-Host "::notice::Skipping Azure Functions deployment because secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE is not set."
            $deployEnabled = $false
          }

          if ($deployEnabled) {
            if (-not (Test-Path -LiteralPath $packagePath -PathType Container)) {
              Write-Host "::error::AZURE_FUNCTIONAPP_PACKAGE_PATH '$packagePath' does not exist."
              exit 1
            }

            $packageJson = Join-Path $packagePath "package.json"
            $hostJson = Join-Path $packagePath "host.json"

            if (-not (Test-Path -LiteralPath $packageJson -PathType Leaf)) {
              Write-Host "::error::AZURE_FUNCTIONAPP_PACKAGE_PATH '$packagePath' must contain package.json."
              exit 1
            }

            if (-not (Test-Path -LiteralPath $hostJson -PathType Leaf)) {
              Write-Host "::error::AZURE_FUNCTIONAPP_PACKAGE_PATH '$packagePath' must contain host.json for an Azure Functions app."
              exit 1
            }

            if (Test-Path -LiteralPath (Join-Path $packagePath "pnpm-lock.yaml") -PathType Leaf) {
              $packageManager = "pnpm"
            } elseif (Test-Path -LiteralPath (Join-Path $packagePath "yarn.lock") -PathType Leaf) {
              $packageManager = "yarn"
            }
          }

          "deploy_enabled=$($deployEnabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "package_manager=$packageManager" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Report skipped deployment
        if: steps.config.outputs.deploy_enabled != 'true'
        shell: pwsh
        run: |
          Write-Host "Azure Functions deployment is not configured for this repository."
          Write-Host "To enable it, add repository variable AZURE_FUNCTIONAPP_NAME, repository variable AZURE_FUNCTIONAPP_PACKAGE_PATH, and secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE."
          Write-Host "The package path must point to a Node.js Azure Functions app directory that contains package.json and host.json."

      - name: Setup pnpm
        if: steps.config.outputs.deploy_enabled == 'true' && steps.config.outputs.package_manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        if: steps.config.outputs.deploy_enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve project dependencies
        if: steps.config.outputs.deploy_enabled == 'true'
        working-directory: ${{ steps.config.outputs.package_path }}
        shell: pwsh
        env:
          PACKAGE_MANAGER: ${{ steps.config.outputs.package_manager }}
        run: |
          switch ($env:PACKAGE_MANAGER) {
            "pnpm" {
              pnpm install --frozen-lockfile
              break
            }
            "yarn" {
              yarn install --frozen-lockfile
              break
            }
            default {
              if (Test-Path -LiteralPath "package-lock.json" -PathType Leaf) {
                npm ci
              } else {
                npm install
              }
            }
          }

      - name: Build and test project
        if: steps.config.outputs.deploy_enabled == 'true'
        working-directory: ${{ steps.config.outputs.package_path }}
        shell: pwsh
        env:
          PACKAGE_MANAGER: ${{ steps.config.outputs.package_manager }}
        run: |
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          $scripts = @()
          if ($package.scripts) {
            $scripts = $package.scripts.PSObject.Properties.Name
          }

          foreach ($scriptName in @("build", "test")) {
            if ($scripts -contains $scriptName) {
              switch ($env:PACKAGE_MANAGER) {
                "pnpm" { pnpm run $scriptName; break }
                "yarn" { yarn run $scriptName; break }
                default { npm run $scriptName }
              }
            } else {
              Write-Host "No '$scriptName' script present; skipping."
            }
          }

      - name: Run Azure Functions Action
        if: steps.config.outputs.deploy_enabled == 'true'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ steps.config.outputs.package_path }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
